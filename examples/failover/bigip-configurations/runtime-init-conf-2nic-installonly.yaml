# Offline variant: install DO, AS3 and CFE from INTERNAL URLs and apply NO declaration. The units are licensed by hand first (stage2-license.py),
# then the declarations are applied (stage2-apply.py). See section 13 of README-2nic-internal.md.
# EDIT the three extensionUrl lines: replace <INTERNAL-HOST> with the host and path where you placed the files. The BIG-IP must be able to fetch them over HTTP(S)
# from the MANAGEMENT subnet with no credentials (a UNC or file-share path will not work).
controls:
  logLevel: info
  logFilename: /var/log/cloud/bigIpRuntimeInit.log
extension_packages:
  install_operations:
    - extensionType: do
      extensionUrl: https://<INTERNAL-HOST>/f5-files/f5-declarative-onboarding-1.44.0-5.noarch.rpm
      extensionVersion: 1.44.0
      extensionHash: 3b05d9bcafbcf0b5b625ff81d6bab5ad26ed90c0dd202ded51756af3598a97ec
    - extensionType: as3
      extensionUrl: https://<INTERNAL-HOST>/f5-files/f5-appsvcs-3.51.0-5.noarch.rpm
      extensionVersion: 3.51.0
      extensionHash: e151a9ccd0fd60c359f31839dc3a70bfcf2b46b9fedb8e1c37e67255ee482c0f
    - extensionType: cf
      extensionUrl: https://<INTERNAL-HOST>/f5-files/f5-cloud-failover-2.1.2-2.noarch.rpm
      extensionVersion: 2.1.2
      extensionHash: 476d38a4d32d6474ae5435b5d448b318e638db4655edf049944f854504310839
post_onboard_enabled: []
pre_onboard_enabled: []
